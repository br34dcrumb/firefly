# firefly_version_strings.cfg — Firefly's own version-identifier rules.
#
# This file is a CLEAN-ROOM alternative to the bundled EMBA file
# (bin_version_strings.cfg, which is GPL-3.0). Every rule here was authored from
# the publicly observable `--version`/banner output of each tool — the kind of
# string a binary prints about itself — NOT by copying, transliterating or
# rearranging EMBA's regexes. The *facts* (what version string a program emits)
# are not copyrightable; the specific expressions below are Firefly's own, so
# this file carries the same licence as the Firefly project, with no GPL
# constraint. Select it with `firefly scan --version-config native`.
#
# Format is identical to the EMBA file so firefly/versioncfg.py parses both:
#   name;mode;license;"grep -E regex";"sed -r 's/regex/replacement/'";
# The replacement yields `product:version` or `vendor:product:version`, which
# firefly/components.py canonicalises to NVD vendor/product pairs.
#
# Scope: the packages most often seen in embedded Linux firmware. This set is
# intentionally smaller than EMBA's and grows over time; it is breadth-for-
# licence, not a drop-in replacement for EMBA's long tail.

# --- C libraries / TLS ---
glibc;;native;"GNU\ C\ Library.*release\ version\ [0-9]+\.[0-9]+";"sed -r 's/GNU\ C\ Library.*release\ version\ ([0-9]+\.[0-9]+).*/gnu:glibc:\1/'";
uclibc;;native;"uClibc\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/uClibc\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/uclibc:uclibc:\1/'";
uclibc-ng;;native;"uClibc-ng\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/uClibc-ng\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/uclibc-ng:uclibc-ng:\1/'";
openssl;;native;"OpenSSL\ [0-9]+\.[0-9]+\.[0-9]+[a-z]?";"sed -r 's/OpenSSL\ ([0-9]+\.[0-9]+\.[0-9]+[a-z]?).*/openssl:openssl:\1/'";
gnutls;;native;"GnuTLS\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/GnuTLS\ ([0-9]+\.[0-9]+\.[0-9]+).*/gnu:gnutls:\1/'";
libgcrypt;;native;"Libgcrypt\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/Libgcrypt\ ([0-9]+\.[0-9]+\.[0-9]+).*/gnupg:libgcrypt:\1/'";
mbedtls;;native;"mbed\ TLS\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/mbed\ TLS\ ([0-9]+\.[0-9]+\.[0-9]+).*/arm:mbed_tls:\1/'";
zlib;;native;"flate\ [0-9]+\.[0-9]+(\.[0-9]+)?\ Copyright";"sed -r 's/flate\ ([0-9]+\.[0-9]+(\.[0-9]+)?)\ Copyright/zlib:zlib:\1/'";

# --- SSH / remote access ---
dropbear;;native;"Dropbear\ v20[0-9][0-9]\.[0-9]+";"sed -r 's/Dropbear\ v(20[0-9][0-9]\.[0-9]+).*/dropbear:dropbear:\1/'";
dropbear;;native;"dropbear_20[0-9][0-9]\.[0-9]+";"sed -r 's/dropbear_(20[0-9][0-9]\.[0-9]+).*/dropbear:dropbear:\1/'";
openssh;;native;"OpenSSH_[0-9]+\.[0-9]+(p[0-9]+)?";"sed -r 's/OpenSSH_([0-9]+\.[0-9]+(p[0-9]+)?).*/openbsd:openssh:\1/'";
libssh2;;native;"libssh2/[0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/libssh2\/([0-9]+\.[0-9]+\.[0-9]+).*/libssh2:libssh2:\1/'";

# --- Web servers / HTTP ---
lighttpd;;native;"lighttpd/[0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/lighttpd\/([0-9]+\.[0-9]+\.[0-9]+).*/lighttpd:lighttpd:\1/'";
nginx;;native;"nginx/[0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/nginx\/([0-9]+\.[0-9]+\.[0-9]+).*/f5:nginx:\1/'";
curl;;native;"curl\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/curl\ ([0-9]+\.[0-9]+\.[0-9]+).*/haxx:curl:\1/'";
curl;;native;"libcurl/[0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/libcurl\/([0-9]+\.[0-9]+\.[0-9]+).*/haxx:curl:\1/'";
wget;;native;"GNU\ Wget\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/GNU\ Wget\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/gnu:wget:\1/'";

# --- Networking daemons / tools ---
dnsmasq;;native;"Dnsmasq\ version\ [0-9]+\.[0-9]+";"sed -r 's/Dnsmasq\ version\ ([0-9]+\.[0-9]+).*/thekelleys:dnsmasq:\1/'";
dnsmasq;;native;"dnsmasq-[0-9]+\.[0-9]+";"sed -r 's/dnsmasq-([0-9]+\.[0-9]+).*/thekelleys:dnsmasq:\1/'";
iptables;;native;"iptables\ v[0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/iptables\ v([0-9]+\.[0-9]+\.[0-9]+).*/netfilter:iptables:\1/'";
iproute2;;native;"iproute2-[0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/iproute2-([0-9]+\.[0-9]+(\.[0-9]+)?).*/iproute2:iproute2:\1/'";
hostapd;;native;"hostapd\ v[0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/hostapd\ v([0-9]+\.[0-9]+(\.[0-9]+)?).*/w1.fi:hostapd:\1/'";
wpa_supplicant;;native;"wpa_supplicant\ v[0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/wpa_supplicant\ v([0-9]+\.[0-9]+(\.[0-9]+)?).*/w1.fi:wpa_supplicant:\1/'";
miniupnpd;;native;"MiniUPnPd/[0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/MiniUPnPd\/([0-9]+\.[0-9]+(\.[0-9]+)?).*/miniupnp_project:miniupnpd:\1/'";
openvpn;;native;"OpenVPN\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/OpenVPN\ ([0-9]+\.[0-9]+\.[0-9]+).*/openvpn:openvpn:\1/'";
strongswan;;native;"strongSwan\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/strongSwan\ ([0-9]+\.[0-9]+\.[0-9]+).*/strongswan:strongswan:\1/'";
pppd;;native;"pppd\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/pppd\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/ppp:ppp:\1/'";
ntp;;native;"ntpd\ [0-9]+\.[0-9]+\.[0-9]+(p[0-9]+)?";"sed -r 's/ntpd\ ([0-9]+\.[0-9]+\.[0-9]+(p[0-9]+)?).*/ntp:ntp:\1/'";
net-snmp;;native;"NET-SNMP\ version\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/NET-SNMP\ version\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/net-snmp:net-snmp:\1/'";
mosquitto;;native;"mosquitto\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/mosquitto\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/eclipse:mosquitto:\1/'";
avahi;;native;"avahi-daemon\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/avahi-daemon\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/avahi:avahi:\1/'";
tcpdump;;native;"tcpdump\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/tcpdump\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/tcpdump:tcpdump:\1/'";
libpcap;;native;"libpcap\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/libpcap\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/tcpdump:libpcap:\1/'";
vsftpd;;native;"vsftpd:\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/vsftpd:\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/vsftpd:vsftpd:\1/'";

# --- Shells / core userland ---
busybox;;native;"BusyBox\ v[0-9]+(\.[0-9]+)+";"sed -r 's/BusyBox\ v([0-9]+(\.[0-9]+)+).*/busybox:busybox:\1/'";
bash;;native;"GNU\ bash,\ version\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/GNU\ bash,\ version\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/gnu:bash:\1/'";
e2fsprogs;;native;"mke2fs\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/mke2fs\ ([0-9]+\.[0-9]+\.[0-9]+).*/e2fsprogs:e2fsprogs:\1/'";
ethtool;;native;"ethtool\ version\ [0-9]+\.[0-9]+";"sed -r 's/ethtool\ version\ ([0-9]+\.[0-9]+).*/ethtool_project:ethtool:\1/'";

# --- Kernel / bootloader / runtimes ---
linux;;native;"Linux\ version\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/Linux\ version\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/linux:linux_kernel:\1/'";
u-boot;;native;"U-Boot\ 20[0-9][0-9]\.[0-9]+";"sed -r 's/U-Boot\ (20[0-9][0-9]\.[0-9]+).*/denx:u-boot:\1/'";
lua;;native;"Lua\ [0-9]+\.[0-9]+(\.[0-9]+)?\ \ Copyright";"sed -r 's/Lua\ ([0-9]+\.[0-9]+(\.[0-9]+)?)\ .*/lua:lua:\1/'";
sqlite;;native;"SQLite\ version\ [0-9]+\.[0-9]+\.[0-9]+";"sed -r 's/SQLite\ version\ ([0-9]+\.[0-9]+\.[0-9]+).*/sqlite:sqlite:\1/'";
iperf;;native;"iperf\ [0-9]+\.[0-9]+(\.[0-9]+)?";"sed -r 's/iperf\ ([0-9]+\.[0-9]+(\.[0-9]+)?).*/iperf:iperf:\1/'";
